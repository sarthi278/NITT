{% extends "base.html" %}
{% block content %}
<div class="card"><h2>New customer order</h2>
<form method="post" action="{{url_for('create_order')}}">
<label>Customer</label><select name="customer_id" required>{% for c in customers %}<option value="{{c.id}}">{{c.name}} — {{c.state}}</option>{% endfor %}</select>
<label>Product</label><select name="product_id">{% for p in products %}<option value="{{p.id}}">{{p.name}} — ₹{{(p.selling_price_paise/100)|round(2)}}</option>{% endfor %}</select>
<label>Packets</label><input name="quantity" type="number" min="1" value="150" required>
<button>Submit order</button></form></div>
<div class="card"><h2>My orders</h2><table><tr><th>Order</th><th>Customer</th><th>Status</th><th>Date</th></tr>
{% for o in orders %}<tr><td>{{o.order_number}}</td><td>{{o.customer}}</td><td>{{o.status}}</td><td>{{o.created_at[:10]}}</td></tr>{% endfor %}</table></div>
{% endblock %}
