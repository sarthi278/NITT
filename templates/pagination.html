{% if page_obj.has_other_pages %}
<nav class="mt-3" aria-label="Pagination"><ul class="pagination justify-content-center">
  {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&amp;q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.state %}&amp;state={{ request.GET.state|urlencode }}{% endif %}{% if request.GET.status %}&amp;status={{ request.GET.status|urlencode }}{% endif %}{% if request.GET.customer_type %}&amp;customer_type={{ request.GET.customer_type|urlencode }}{% endif %}">Previous</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span></li>
  {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&amp;q={{ request.GET.q|urlencode }}{% endif %}{% if request.GET.state %}&amp;state={{ request.GET.state|urlencode }}{% endif %}{% if request.GET.status %}&amp;status={{ request.GET.status|urlencode }}{% endif %}{% if request.GET.customer_type %}&amp;customer_type={{ request.GET.customer_type|urlencode }}{% endif %}">Next</a></li>{% endif %}
</ul></nav>
{% endif %}
