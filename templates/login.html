{% extends "base.html" %}
{% block title %}Sign in · Order-to-Audit{% endblock %}
{% block content %}
<section class="row justify-content-center align-items-center" style="min-height: min(72vh, 680px)">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
    <div class="text-center mb-4">
      <span class="brand-mark mx-auto mb-3" style="width:54px;height:54px;font-size:1.35rem">O</span>
      <h1 class="page-title">Welcome back</h1>
      <p class="page-subtitle">Sign in to your factory workspace.</p>
    </div>
    <div class="card">
      <div class="card-body p-4 p-md-4">
        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" autocomplete="username" placeholder="Enter your username" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
          </div>
          <button class="btn btn-success w-100" type="submit">Sign in</button>
        </form>
        <div class="small text-center text-secondary mt-4">Demo accounts share password <code>demo123</code>.</div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
