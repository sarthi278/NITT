{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:70px auto">
  <h2>Factory Login</h2>
  {% if error %}<p style="color:#b33">{{error}}</p>{% endif %}
  <form method="post">
    <label>Username<br><input name="username" required style="width:95%"></label><br>
    <label>Password<br><input type="password" name="password" required style="width:95%"></label><br>
    <button type="submit">Sign in</button>
  </form>
  <p><b>Demo logins:</b> sales-a / sales-b / admin / production / auditor / owner — password <b>demo123</b></p>
</div>
{% endblock %}
