services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: order_audit
      POSTGRES_USER: order_audit
      POSTGRES_PASSWORD: order_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_audit -d order_audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: order_audit
      DATABASE_USER: order_audit
      DATABASE_PASSWORD: order_audit
      DJANGO_DEBUG: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
